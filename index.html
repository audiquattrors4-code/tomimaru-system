<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>とみまるシステム v0.6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- dcmjs: DICOMパースライブラリ -->
<script src="https://unpkg.com/dcmjs@0.29.8/build/dcmjs.min.js"></script>
<style>
:root {
  --bg: #f5f1ea;
  --bg-card: #fdfbf7;
  --bg-soft: #ede5d6;
  --ink: #2a2520;
  --ink-soft: #6b5d4f;
  --ink-mute: #9a8b7a;
  --accent: #8b5a3c;
  --accent-deep: #6b4226;
  --gold: #b8935a;
  --line: #d8cdb8;
  --line-soft: #e8e0d0;
  --green: #4d7c5a;
  --amber: #d4a536;
  --red: #b8472f;
  --shadow: 0 1px 3px rgba(60,40,20,0.08), 0 4px 12px rgba(60,40,20,0.06);
  --radius: 4px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Noto Sans JP", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* === ヘッダー === */
.app-header {
  background: linear-gradient(180deg, #fdfbf7 0%, #f5f1ea 100%);
  border-bottom: 1px solid var(--line);
  padding: 20px 24px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 0 rgba(0,0,0,0.02);
}
.app-header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.app-title {
  font-family: "Noto Serif JP", serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0.05em;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.app-title .paw { font-size: 24px; }
.app-title .ver {
  font-size: 11px;
  color: var(--ink-mute);
  font-weight: 400;
  letter-spacing: 0.1em;
}
.mode-switch {
  display: flex;
  background: var(--bg-soft);
  border-radius: var(--radius);
  padding: 3px;
  border: 1px solid var(--line);
}
.mode-switch button {
  background: transparent;
  border: none;
  padding: 6px 14px;
  font-size: 13px;
  font-family: inherit;
  color: var(--ink-soft);
  cursor: pointer;
  border-radius: 3px;
  transition: all 0.2s;
  font-weight: 500;
}
.mode-switch button.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 1px 2px rgba(0,0,0,0.1);
}

/* === メインレイアウト === */
.app-main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px;
}

/* === 検索バー === */
.search-bar {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.search-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 10px;
}
.search-row:last-child { margin-bottom: 0; }
.search-row.dates {
  grid-template-columns: 1fr 1fr auto;
  align-items: end;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.field label {
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.05em;
  font-weight: 500;
}
.field input, .field select {
  font-family: inherit;
  font-size: 14px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}
.field input:focus, .field select:focus {
  border-color: var(--accent);
}
.btn-clear {
  background: var(--bg-soft);
  color: var(--ink-soft);
  border: 1px solid var(--line);
  padding: 8px 16px;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  height: fit-content;
  transition: all 0.2s;
}
.btn-clear:hover {
  background: var(--line-soft);
}

/* === 年月ツリー === */
.tree-container {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 768px) {
  .tree-container { grid-template-columns: 1fr; }
}
.tree-sidebar {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 100px;
  max-height: calc(100vh - 140px);
  overflow-y: auto;
}
.tree-title {
  font-family: "Noto Serif JP", serif;
  font-size: 13px;
  color: var(--ink-soft);
  margin: 4px 6px 10px;
  letter-spacing: 0.1em;
  font-weight: 500;
  border-bottom: 1px dashed var(--line);
  padding-bottom: 8px;
}
.tree-year {
  margin-bottom: 4px;
}
.tree-year-label {
  display: flex;
  align-items: center;
  padding: 6px 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
  border-radius: 3px;
  transition: background 0.15s;
  user-select: none;
}
.tree-year-label:hover { background: var(--bg-soft); }
.tree-year-label .caret {
  display: inline-block;
  width: 14px;
  font-size: 10px;
  color: var(--ink-mute);
  transition: transform 0.2s;
}
.tree-year-label.expanded .caret { transform: rotate(90deg); }
.tree-year-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--ink-mute);
  font-weight: 400;
}
.tree-months {
  padding-left: 22px;
  display: none;
}
.tree-months.expanded { display: block; }
.tree-month {
  display: flex;
  align-items: center;
  padding: 5px 8px 5px 10px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-soft);
  border-radius: 3px;
  border-left: 2px solid transparent;
  transition: all 0.15s;
  user-select: none;
}
.tree-month:hover {
  background: var(--bg-soft);
  color: var(--ink);
}
.tree-month.active {
  background: var(--bg-soft);
  color: var(--accent-deep);
  font-weight: 600;
  border-left-color: var(--accent);
}
.tree-month-count {
  margin-left: auto;
  font-size: 11px;
  color: var(--ink-mute);
  background: var(--line-soft);
  padding: 1px 7px;
  border-radius: 10px;
}
.tree-month.active .tree-month-count {
  background: var(--accent);
  color: #fff;
}
.tree-all {
  display: flex;
  align-items: center;
  padding: 6px 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-soft);
  border-radius: 3px;
  margin-bottom: 6px;
  transition: all 0.15s;
}
.tree-all:hover { background: var(--bg-soft); }
.tree-all.active {
  background: var(--accent);
  color: #fff;
}

/* === ケース一覧 === */
.cases-area {
  min-height: 200px;
}
.cases-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 12px;
  padding: 0 4px;
}
.cases-title {
  font-family: "Noto Serif JP", serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
  letter-spacing: 0.05em;
}
.cases-meta {
  font-size: 12px;
  color: var(--ink-mute);
  display: flex;
  align-items: center;
  gap: 10px;
}
.sort-indicator {
  font-size: 11px;
  color: var(--accent);
  background: #f5ecd9;
  padding: 2px 8px;
  border-radius: 10px;
  letter-spacing: 0.05em;
  font-weight: 500;
}
.case-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.case-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: var(--shadow);
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 14px;
  align-items: center;
}
.case-card:hover {
  border-color: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 2px 6px rgba(60,40,20,0.12), 0 6px 16px rgba(60,40,20,0.08);
}
.case-date-block {
  text-align: center;
  padding-right: 14px;
  border-right: 1px solid var(--line-soft);
  min-width: 56px;
}
.case-date-md {
  font-family: "Noto Serif JP", serif;
  font-size: 20px;
  font-weight: 600;
  color: var(--accent-deep);
  line-height: 1.1;
}
.case-date-y {
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.1em;
}
.case-info {
  min-width: 0;
}
.case-row1 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.case-id {
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.08em;
  font-family: "Noto Serif JP", serif;
}
.case-karte {
  font-weight: 600;
  font-size: 14px;
  color: var(--ink);
}
.case-body-part {
  font-size: 13px;
  color: var(--ink-soft);
}
.case-question {
  font-size: 12px;
  color: var(--ink-soft);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.case-badges {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}
.badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  white-space: nowrap;
}
.badge-pending {
  background: #fef4dd;
  color: #8a6510;
  border: 1px solid #e8c977;
}
.badge-reported {
  background: #e3f0e6;
  color: #2d5a38;
  border: 1px solid #97c3a3;
}
.badge-urgency-1 { background: #e8f0e8; color: var(--green); }
.badge-urgency-2 { background: #fef4dd; color: var(--amber); }
.badge-urgency-3 { background: #fde4dd; color: var(--red); border: 1px solid #e8a294; }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--ink-mute);
  font-size: 14px;
  background: var(--bg-card);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}
.empty-state .paw { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.4; }

/* === ページネーション === */
.pagination {
  display: flex;
  justify-content: center;
  margin-top: 16px;
}
.btn-more {
  background: var(--bg-card);
  border: 1px solid var(--line);
  padding: 10px 28px;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 13px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-more:hover {
  border-color: var(--accent);
  color: var(--accent-deep);
}

/* === 新規ケース作成ボタン === */
.fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 50px;
  padding: 14px 22px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(139,90,60,0.4);
  z-index: 50;
  transition: all 0.2s;
}
.fab:hover {
  background: var(--accent-deep);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(139,90,60,0.5);
}

/* === モーダル === */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(42,37,32,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-card);
  border-radius: var(--radius);
  max-width: 720px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  animation: slideUp 0.25s;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  padding: 18px 22px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--bg-card);
  z-index: 1;
}
.modal-title {
  font-family: "Noto Serif JP", serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--ink);
}
.modal-close {
  background: transparent;
  border: none;
  font-size: 24px;
  color: var(--ink-mute);
  cursor: pointer;
  padding: 0 4px;
}
.modal-body {
  padding: 20px 22px;
}
.modal-footer {
  padding: 14px 22px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--bg-card);
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 9px 22px;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--accent-deep); }
.btn-primary:disabled { background: var(--ink-mute); cursor: not-allowed; }
.btn-secondary {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--ink-soft);
  padding: 9px 18px;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-secondary:hover {
  background: var(--bg-soft);
  border-color: var(--ink-mute);
}

.form-field {
  margin-bottom: 14px;
}
.form-field label {
  display: block;
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 5px;
  font-weight: 500;
  letter-spacing: 0.03em;
}
.form-field label .req { color: var(--red); margin-left: 3px; }
.form-field label .auto {
  font-size: 10px;
  color: var(--gold);
  margin-left: 6px;
  font-weight: 400;
}
.form-field input, .form-field textarea, .form-field select {
  width: 100%;
  font-family: inherit;
  font-size: 14px;
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  color: var(--ink);
  outline: none;
}
.form-field input:focus, .form-field textarea:focus, .form-field select:focus {
  border-color: var(--accent);
}
.form-field textarea { resize: vertical; min-height: 80px; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.urgency-radio {
  display: flex;
  gap: 8px;
}
.urgency-radio label {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  font-weight: 600;
  transition: all 0.15s;
  background: #fff;
}
.urgency-radio input { display: none; }
.urgency-radio input:checked + span {
  display: inline-block;
}
.urgency-radio label:has(input:checked) {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
.urgency-radio label:hover { border-color: var(--accent); }

.file-drop {
  border: 2px dashed var(--line);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  background: var(--bg-soft);
  cursor: pointer;
  transition: all 0.15s;
  margin-bottom: 8px;
}
.file-drop:hover { border-color: var(--accent); background: #f0e8d8; }
.file-drop.drag-over { border-color: var(--accent); background: #f0e8d8; }
.file-drop .hint { font-size: 12px; color: var(--ink-mute); }
.file-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}
.file-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--bg-soft);
  border-radius: 3px;
  font-size: 12px;
}
.file-item .name { color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-item .size { color: var(--ink-mute); margin: 0 8px; }
.file-item button {
  background: transparent;
  border: none;
  color: var(--red);
  cursor: pointer;
  font-size: 16px;
  padding: 0 4px;
}
.dicom-info {
  background: #f5ecd9;
  border-left: 3px solid var(--gold);
  padding: 8px 12px;
  font-size: 11px;
  color: var(--ink-soft);
  margin-top: 6px;
  border-radius: 2px;
}
.dicom-info .label { font-weight: 600; color: var(--accent-deep); }

/* === 詳細・所見 === */
.detail-section {
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--line);
}
.detail-section:last-child { border-bottom: none; }
.detail-label {
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.1em;
  margin-bottom: 4px;
  font-weight: 500;
}
.detail-value {
  font-size: 14px;
  color: var(--ink);
}
.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.report-text {
  white-space: pre-wrap;
  background: var(--bg-soft);
  padding: 12px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  line-height: 1.7;
  border-left: 3px solid var(--green);
}
.images-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
}
.image-thumb {
  aspect-ratio: 1;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 3px;
  overflow: hidden;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--ink-mute);
  position: relative;
}
.image-thumb img { width: 100%; height: 100%; object-fit: cover; }
.image-thumb .ext {
  position: absolute;
  top: 4px;
  right: 4px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 9px;
  padding: 1px 5px;
  border-radius: 2px;
  letter-spacing: 0.05em;
}

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 300;
  padding: 20px;
}
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lightbox-close {
  position: absolute;
  top: 16px;
  right: 20px;
  color: #fff;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.3);
  font-size: 22px;
  padding: 4px 12px;
  cursor: pointer;
  border-radius: 3px;
}

.toast {
  position: fixed;
  bottom: 90px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 400;
  box-shadow: 0 4px 14px rgba(0,0,0,0.3);
  animation: toastIn 0.3s;
}
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

/* === スピナー === */
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* === 下書きキュー (v0.6) === */
.draft-section {
  background: linear-gradient(180deg, #fff8e8 0%, #faecd0 100%);
  border: 1px solid #d4b67a;
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 20px;
  box-shadow: 0 1px 3px rgba(184,147,90,0.15);
}
.draft-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px dashed #d4b67a;
}
.draft-title {
  font-family: "Noto Serif JP", serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--accent-deep);

<div id="toast" style="display:none"></div>

<script>
// =====================================================
// とみまるシステム v0.5 - フロントエンド
// =====================================================

// ⚠️ ここを自分のGAS WebアプリURLに置き換えてください
const GAS_URL = 'https://script.google.com/macros/s/AKfycbw3Z_weqy06SBmtj7oskjWRepCp2wUG4UdSsN1_X52r4ZT0s9BlNf3xPxj0tNui5KxN/exec';

// 状態
const state = {
  mode: 'tosutosu', // 'tosutosu' | 'tomimaru'
  cases: [],
  filtered: [],
  selectedYear: null,  // null = すべて
  selectedMonth: null, // null = すべて または 年だけ選択
  searchText: '',
  filterStatus: 'all',
  filterUrgency: 'all',
  dateFrom: '',
  dateTo: '',
  page: 1,
  pageSize: 20,
  pendingFiles: [], // [{file, dataUrl?, base64, imagingDate?}]
};

// =====================================================
// ユーティリティ
// =====================================================
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return Array.from(document.querySelectorAll(sel)); }

function toast(msg, ms) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast';
  el.style.display = 'block';
  setTimeout(function() { el.style.display = 'none'; }, ms || 2500);
}

function formatDate(d) {
  if (!d) return '';
  if (typeof d === 'string') return d.split(' ')[0]; // datetime対応
  const dt = (d instanceof Date) ? d : new Date(d);
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, '0');
  const day = String(dt.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function parseImagingDate(s) {
  if (!s) return null;
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return null;
  return { year: parseInt(m[1]), month: parseInt(m[2]), day: parseInt(m[3]), iso: m[0] };
}

function todayStr() {
  return formatDate(new Date());
}

function fileToBase64(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function() {
      // result は "data:xxx;base64,XXXX" 形式
      const b64 = String(reader.result).split(',')[1];
      resolve(b64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function fileToDataURL(file) {
  return new Promise(function(resolve, reject) {
    const reader = new FileReader();
    reader.onload = function() { resolve(reader.result); };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// =====================================================
// DICOM日付抽出
// =====================================================
function isDicomFile(file) {
  const name = file.name.toLowerCase();
  return name.endsWith('.dcm') || file.type === 'application/dicom';
}

async function extractDicomDate(file) {
  try {
    const buf = await file.arrayBuffer();
    const dicomData = dcmjs.data.DicomMessage.readFile(buf);
    const dataset = dcmjs.data.DicomMetaDictionary.naturalizeDataset(dicomData.dict);

    // StudyDate (0008,0020) を優先、なければ AcquisitionDate / SeriesDate / ContentDate
    const dateStr = dataset.StudyDate || dataset.AcquisitionDate || dataset.SeriesDate || dataset.ContentDate;
    if (!dateStr) return null;
    // 形式: YYYYMMDD
    const s = String(dateStr);
    if (s.length !== 8) return null;
    return s.substring(0,4) + '-' + s.substring(4,6) + '-' + s.substring(6,8);
  } catch (err) {
    console.warn('DICOM parse error:', err);
    return null;
  }
}

// =====================================================
// API
// =====================================================
async function apiGet(action) {
  const url = GAS_URL + '?action=' + encodeURIComponent(action);
  const res = await fetch(url);
  return res.json();
}

async function apiPost(payload) {
  // GAS は CORS の都合で text/plain で送る
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    redirect: 'follow',
  });
  return res.json();
}

// =====================================================
// データロード
// =====================================================
async function loadCases() {
  try {
    const res = await apiGet('getCases');
    if (!res.success) throw new Error(res.error);
    state.cases = (res.data || []).map(function(c) {
      // imagingDate が空なら createdAt から推定
      if (!c.imagingDate && c.createdAt) {
        c.imagingDate = formatDate(c.createdAt);
      }
      return c;
    });
    applyFilter();
    renderTree();
    render();
    renderDrafts();
  } catch (err) {
    toast('読み込みエラー: ' + err.message, 4000);
  }
}

// =====================================================
// フィルタリング
// =====================================================
function applyFilter() {
  const q = state.searchText.trim().toLowerCase();
  state.filtered = state.cases.filter(function(c) {
    // draftは別セクションで表示するので一覧からは除外
    if (c.status === 'draft') return false;
    // テキスト検索 (カルテNo / 部位 / ID)
    if (q) {
      const hay = (String(c.karteNo || '') + ' ' + String(c.bodyPart || '') + ' ' + String(c.id || '')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    // 状態
    if (state.filterStatus !== 'all' && c.status !== state.filterStatus) return false;
    // 緊急度
    if (state.filterUrgency === '★★★' && c.urgency !== '★★★') return false;
    if (state.filterUrgency === '★★' && c.urgency !== '★★' && c.urgency !== '★★★') return false;
    // 撮像日範囲
    if (state.dateFrom && c.imagingDate < state.dateFrom) return false;
    if (state.dateTo && c.imagingDate > state.dateTo) return false;
    // 年月ツリー選択
    if (state.selectedYear !== null) {
      const pd = parseImagingDate(c.imagingDate);
      if (!pd) return false;
      if (pd.year !== state.selectedYear) return false;
      if (state.selectedMonth !== null && pd.month !== state.selectedMonth) return false;
    }
    return true;
  });
  // 並び順: 新しい→古い
  //   1) 撮像日降順 (空は最後)
  //   2) 同日なら依頼日(createdAt)降順
  //   3) さらに同じなら ID 降順 (CASE-XXXX の数字部分)
  state.filtered.sort(function(a, b) {
    const ai = a.imagingDate || '';
    const bi = b.imagingDate || '';
    // 撮像日が空のものは常に最後
    if (!ai && bi) return 1;
    if (ai && !bi) return -1;
    if (ai !== bi) return ai < bi ? 1 : -1;

    // 依頼日降順
    const ac = a.createdAt || '';
    const bc = b.createdAt || '';
    if (ac !== bc) return ac < bc ? 1 : -1;

    // ID降順 (CASE-0042 の数字部分)
    const an = parseInt(String(a.id || '').replace(/\D/g, '')) || 0;
    const bn = parseInt(String(b.id || '').replace(/\D/g, '')) || 0;
    return bn - an;
  });
  state.page = 1;
}

// =====================================================
// 年月ツリー描画
// =====================================================
function buildTreeData() {
  // { year: { month: count } }
  const tree = {};
  state.cases.forEach(function(c) {
    if (c.status === 'draft') return;  // draftはツリーに含めない
    const pd = parseImagingDate(c.imagingDate);
    if (!pd) return;
    if (!tree[pd.year]) tree[pd.year] = {};
    if (!tree[pd.year][pd.month]) tree[pd.year][pd.month] = 0;
    tree[pd.year][pd.month]++;
  });
  return tree;
}

function renderTree() {
  const data = buildTreeData();
  const treeEl = $('#tree');
  $('#treeAllCount').textContent = state.cases.filter(function(c){return c.status !== 'draft';}).length;

  const years = Object.keys(data).map(Number).sort(function(a,b){return b-a;});

  const today = new Date();
  const currentYear = today.getFullYear();
  const currentMonth = today.getMonth() + 1;

  treeEl.innerHTML = years.map(function(year) {
    const months = Object.keys(data[year]).map(Number).sort(function(a,b){return b-a;});
    const yearTotal = months.reduce(function(s, m){ return s + data[year][m]; }, 0);
    const expanded = (year === currentYear);

    const monthsHtml = months.map(function(m) {
      const isActive = (state.selectedYear === year && state.selectedMonth === m);
      return '<div class="tree-month' + (isActive ? ' active' : '') + '" data-year="' + year + '" data-month="' + m + '">' +
             '<span>' + m + '月</span>' +
             '<span class="tree-month-count">' + data[year][m] + '</span>' +
             '</div>';
    }).join('');

    return '<div class="tree-year">' +
           '<div class="tree-year-label' + (expanded ? ' expanded' : '') + '" data-year-toggle="' + year + '">' +
           '<span class="caret">▶</span>' +
           '<span>' + year + '年</span>' +
           '<span class="tree-year-count">' + yearTotal + '</span>' +
           '</div>' +
           '<div class="tree-months' + (expanded ? ' expanded' : '') + '" data-year-months="' + year + '">' +
           monthsHtml +
           '</div>' +
           '</div>';
  }).join('');

  // 年トグル
  $$('[data-year-toggle]').forEach(function(el) {
    el.addEventListener('click', function() {
      const year = parseInt(el.dataset.yearToggle);
      const monthsEl = treeEl.querySelector('[data-year-months="' + year + '"]');
      el.classList.toggle('expanded');
      monthsEl.classList.toggle('expanded');
    });
  });

  // 月クリック
  $$('.tree-month').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      state.selectedYear = parseInt(el.dataset.year);
      state.selectedMonth = parseInt(el.dataset.month);
      $('#treeAll').classList.remove('active');
      applyFilter();
      renderTree();
      render();
    });
  });
}

// =====================================================
// ケース一覧 描画
// =====================================================
function render() {
  // タイトル
  let title = 'すべて';
  if (state.selectedYear !== null) {
    title = state.selectedYear + '年';
    if (state.selectedMonth !== null) {
      title += ' ' + state.selectedMonth + '月';
    }
  }
  $('#casesTitle').textContent = title;
  $('#casesMeta').textContent = state.filtered.length + '件';

  const listEl = $('#caseList');
  if (state.filtered.length === 0) {

    const urgBadge = '<span class="badge ' + urgClass + '">' + (c.urgency || '★') + '</span>';

function renderDrafts() {
  const drafts = state.cases.filter(function(c){ return c.status === 'draft'; })
    .sort(function(a, b) {
      // 撮像日降順
      const ai = a.imagingDate || '';
      const bi = b.imagingDate || '';
      if (ai !== bi) return ai < bi ? 1 : -1;
      const an = parseInt(String(a.id || '').replace(/\D/g, '')) || 0;
      const bn = parseInt(String(b.id || '').replace(/\D/g, '')) || 0;
      return bn - an;
    });

  const section = $('#draftSection');
  if (drafts.length === 0) {
    section.style.display = 'none';
    return;
  }

  section.style.display = 'block';
  $('#draftCount').textContent = drafts.length + '件 準備済み';

  const listEl = $('#draftList');
  listEl.innerHTML = drafts.map(function(d) {
    const compareHtml = d.compareUrls && d.compareUrls.length
      ? '<div class="compare-section">' +
          '<span class="label">📎 比較画像 (過去Study) ' + d.compareUrls.length + '件</span>' +
          '<div class="compare-thumbs">' +
            d.compareUrls.map(function(url, i){
              return '<a href="' + url + '" target="_blank" rel="noopener">過去画像 ' + (i+1) + '</a>';
            }).join('') +
          '</div>' +
        '</div>'
      : '';

    return '<div class="draft-card" data-draft-id="' + d.id + '">' +
             '<div class="draft-card-head">' +
               '<div class="draft-meta">' +
                 '<span class="id">' + d.id + '</span>' +
                 '<input type="text" class="draft-karte" data-field="karteNo" value="' + (d.karteNo||'') + '" style="font-weight:700;border:1px solid var(--line);padding:3px 6px;border-radius:3px;width:100px;font-size:13px">' +
                 '<input type="text" class="draft-bodypart" data-field="bodyPart" value="' + (d.bodyPart||'') + '" style="border:1px solid var(--line);padding:3px 6px;border-radius:3px;width:120px;font-size:13px">' +
                 '<input type="date" class="draft-date" data-field="imagingDate" value="' + (d.imagingDate||'') + '" style="border:1px solid var(--line);padding:3px 6px;border-radius:3px;font-size:13px">' +
               '</div>' +
               '<span class="draft-file-count">📁 ' + (d.fileUrls?d.fileUrls.length:0) + '枚</span>' +
             '</div>' +
             '<div class="draft-form">' +
               '<textarea data-field="question" placeholder="依頼内容・臨床経過・既往歴など">' + (d.question||'') + '</textarea>' +
               '<div class="draft-urgency-mini">' +
                 '<label><input type="radio" name="urg-' + d.id + '" value="★"' + (d.urgency==='★'||!d.urgency?' checked':'') + '><span>★</span></label>' +
                 '<label><input type="radio" name="urg-' + d.id + '" value="★★"' + (d.urgency==='★★'?' checked':'') + '><span>★★</span></label>' +
                 '<label><input type="radio" name="urg-' + d.id + '" value="★★★"' + (d.urgency==='★★★'?' checked':'') + '><span>★★★</span></label>' +
               '</div>' +
             '</div>' +
             compareHtml +
             '<div class="draft-actions">' +
               '<div class="draft-actions-left">' +
                 (d.fileUrls && d.fileUrls.length ? '<a class="draft-link" href="' + d.fileUrls[0] + '" target="_blank" rel="noopener">📷 画像確認</a>' : '') +
               '</div>' +
               '<div class="draft-actions-right">' +
                 '<button class="btn-draft-delete" data-action="delete">削除</button>' +
                 '<button class="btn-draft-send" data-action="send">🚀 とみまるに送信</button>' +
               '</div>' +
             '</div>' +
           '</div>';
  }).join('');

  // イベントバインド
  listEl.querySelectorAll('.draft-card').forEach(function(card) {
    const draftId = card.dataset.draftId;
    card.querySelector('[data-action="send"]').addEventListener('click', function() {
      sendDraft(draftId, card);
    });
    card.querySelector('[data-action="delete"]').addEventListener('click', function() {
      deleteDraft(draftId);
    });
  });
}

async function sendDraft(draftId, cardEl) {
  // フォームの値を収集
  const karteNo = cardEl.querySelector('[data-field="karteNo"]').value.trim();
  const bodyPart = cardEl.querySelector('[data-field="bodyPart"]').value.trim();
  const imagingDate = cardEl.querySelector('[data-field="imagingDate"]').value;
  const question = cardEl.querySelector('[data-field="question"]').value.trim();
  const urgency = cardEl.querySelector('input[name="urg-' + draftId + '"]:checked').value;

  if (!karteNo) { toast('カルテNoを入力してください'); return; }
  if (!bodyPart) { toast('部位を入力してください'); return; }
  if (!imagingDate) { toast('撮像日を入力してください'); return; }

  const btn = cardEl.querySelector('[data-action="send"]');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>送信中...';

  try {
    const res = await apiPost({
      action: 'promoteDraft',
      id: draftId,
      karteNo: karteNo,
      bodyPart: bodyPart,
      imagingDate: imagingDate,
      question: question,
      urgency: urgency,
    });
    if (!res.success) throw new Error(res.error);
    toast('✅ ' + draftId + ' をとみまるに送信しました');
    await loadCases();
  } catch (err) {
    toast('エラー: ' + err.message, 4000);
    btn.disabled = false;
    btn.textContent = '🚀 とみまるに送信';
  }
}

async function deleteDraft(draftId) {
  if (!confirm(draftId + ' を削除しますか?\n(Driveにアップロードされた画像は残ります)')) return;
  try {
    const res = await apiPost({ action: 'deleteDraft', id: draftId });
    if (!res.success) throw new Error(res.error);
    toast('🗑 削除しました');
    await loadCases();
  } catch (err) {
    toast('エラー: ' + err.message, 4000);
  }
}

               '</div>' +

               '<div class="detail-label">依頼内容</div>' +
               '<div class="detail-value" style="white-space:pre-wrap">' + (c.question || '-') + '</div>' +

              '<div class="form-field" style="margin-top:6px">' +

                '</div>' +

            '</div>';

              '<div class="detail-label">読影所見 (' + (c.reportDate || '') + ')</div>' +
              '<div class="report-text">' + (c.report || '').replace(/[<>]/g, '') + '</div>' +

  $('#modalDetail').style.display = 'flex';

// ライトボックス

function openLightbox(url) {
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = '<button class="lightbox-close">×</button><img src="' + url + '">';
  box.addEventListener('click', function(e) {
    if (e.target === box || e.target.classList.contains('lightbox-close')) {
      document.body.removeChild(box);
    }
  });
  document.body.appendChild(box);
}

// =====================================================
async function handleFiles(files) {
  const arr = Array.from(files);
  let detectedDate = null;
  $('#dicomInfo').style.display = 'none';
  $('#dateAutoLabel').style.display = 'none';

  for (const file of arr) {
    const item = { file: file, base64: null, dataUrl: null };
    if (isDicomFile(file)) {
      const dt = await extractDicomDate(file);
      if (dt && !detectedDate) {
        detectedDate = dt;
      }
    }
    item.base64 = await fileToBase64(file);
    state.pendingFiles.push(item);
  }

  if (detectedDate) {
    $('#newImagingDate').value = detectedDate;
    $('#dateAutoLabel').style.display = 'inline';
    $('#dicomInfo').innerHTML = '<div class="dicom-info"><span class="label">DICOM StudyDate を取得:</span> ' + detectedDate + '</div>';
    $('#dicomInfo').style.display = 'block';
  }

  renderFileList();
}

function renderFileList() {
  const el = $('#fileList');
  el.innerHTML = state.pendingFiles.map(function(item, i) {
    const sizeKB = Math.round(item.file.size / 1024);
    return '<div class="file-item">' +
             '<span class="name">' + item.file.name + '</span>' +
             '<span class="size">' + sizeKB + ' KB</span>' +
             '<button data-remove="' + i + '">×</button>' +
           '</div>';
  }).join('');
  el.querySelectorAll('[data-remove]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      state.pendingFiles.splice(parseInt(btn.dataset.remove), 1);
      renderFileList();
    });
  });
}

async function submitNewCase() {
  const karteNo = $('#newKarteNo').value.trim();
  const bodyPart = $('#newBodyPart').value.trim();
  const imagingDate = $('#newImagingDate').value;
  const question = $('#newQuestion').value.trim();
  const urgency = document.querySelector('input[name="newUrgency"]:checked').value;

  if (!karteNo || !bodyPart) { toast('カルテNoと部位は必須です'); return; }
  if (!imagingDate) { toast('撮像日は必須です'); return; }
  if (state.pendingFiles.length === 0) { toast('画像ファイルを選択してください'); return; }

  const btn = $('#btnSubmitCase');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>送信中...';

  try {
    // 1. ファイルアップロード
    const fileUrls = [];
    for (const item of state.pendingFiles) {
      const res = await apiPost({
        action: 'uploadFile',
        fileName: item.file.name,
        mimeType: item.file.type || 'application/octet-stream',
        base64: item.base64,
      });
      if (!res.success) throw new Error('ファイルアップロード失敗: ' + res.error);
      fileUrls.push(res.data.url);
    }
    // 2. ケース作成
    const res = await apiPost({
      action: 'createCase',
      karteNo: karteNo,
      bodyPart: bodyPart,
      imagingDate: imagingDate,
      question: question,
      urgency: urgency,
      fileUrls: fileUrls,
    });
    if (!res.success) throw new Error(res.error);

    toast('依頼を送信しました: ' + res.data.id);
    closeCreateModal();
    await loadCases();
  } catch (err) {
    toast('エラー: ' + err.message, 5000);
    btn.disabled = false;
    btn.textContent = '依頼を送信';
  }
}

  const btn = $('#btnDraftToggle');
  if (list.classList.contains('collapsed')) {
    list.classList.remove('collapsed');
    btn.textContent = '折りたたむ';
  } else {
    list.classList.add('collapsed');
    btn.textContent = '展開';
  }
});

// =====================================================
// 起動
// =====================================================
loadCases();

// 30秒ごとに自動更新 (下書きが追加されるのを検出するため)
setInterval(function() {
  loadCases();
}, 30000);
</script>
</body>
